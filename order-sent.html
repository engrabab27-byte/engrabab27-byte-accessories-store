<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7fa">
  <title>طلبك وصل | FEDAA STORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .success-page {
      min-height: calc(100vh - 112px);
      padding: 45px 20px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .success-content {
      max-width: 460px;
    }

    .success-mark {
      width: 76px;
      height: 76px;
      margin: 0 auto 23px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #f8e8ee;
      color: var(--green);
      font-size: 34px;
    }

    .success-content h1 {
      margin: 0;
      font-size: 39px;
    }

    .success-content>p:not(.eyebrow) {
      margin: 13px auto 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
    }

    .success-content .eyebrow {
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <div class="announcement">إكسسوارات FEDAA STORE <span aria-hidden="true">✳</span> توصيل إلى جميع محافظات مصر</div>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="FEDAA STORE، الصفحة الرئيسية"><img class="brand-logo" src="logo.png"
        alt=""><span class="brand-name">FEDAA STORE</span></a>
  </header>
  <main class="success-page">
    <div class="success-content">
      <span class="success-mark" aria-hidden="true">✓</span>
      <p class="eyebrow">وصلنا طلبك بنجاح</p>
      <h1>شكرًا لاختيارك FEDAA STORE</h1>
      <p>هنراجع بيانات الطلب وإيصال التحويل، ونتواصل معاكي على رقم الموبايل لتأكيد التوصيل.</p>
      <a class="button button-dark" href="index.html">ارجعي للتسوق <span aria-hidden="true">←</span></a>
    </div>
  </main>
  <footer class="site-footer"><a class="brand footer-brand" href="index.html"><img class="brand-logo" src="logo.png"
        alt=""><span class="brand-name">FEDAA STORE</span></a><span>© FEDAA STORE. صُنع بحب في مصر.</span></footer>
</body>

</html>
